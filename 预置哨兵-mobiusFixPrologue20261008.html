<!-- ==================== Möbius v111z75 · 预置哨兵（2026-10-08 · 批二 ④ 补遗）====================
   位置要求：必须放在 <head> 里（比主脚本更早执行）。它是「主动消息节奏」补丁的第一道闸。

   为什么需要它（实测 repro-proactive-long / probe-loadfire）：
     · 应用在**主脚本刚跑起来的时候**就会处理一次主动事件。那时本文件末尾的补丁块还没装上，
       所以「两条主动消息之间至少『最快』」这道闸对这一次点火无效 —— 实测：上一条主动消息
       才过了 10 秒（面板最快 5 分钟），打开 App 1~2 秒内又放出来一条。
     · 另外，到点已经过去很久的那些（App 关着的时候错过的）会被当成「现在刚到」，
       时间显示「刚刚」—— 看着就是「TA 刚刚又开始发消息了」，其实那是半小时前该到的。

   这个哨兵只做三件小事（纯读改 localStorage，不碰任何 DOM、不改任何函数）：
     ① 地板：距上一条「真的说出口」的主动消息不足「最快」时，把还没兑现的过期排期往后推
        （推到「上一条 + 最快」那一格）；
     ② 记账：如果确实有「合法但迟到」的排期（离开超过 1 分钟），把它的真实到点记在
        window.__mobiusLateDueAt 上，交给页尾的补丁块，让那条消息显示它本来的时间；
     ③ 全程 try/catch，出任何问题都不影响 App 启动。

   ⚠ 这一段与页尾的 <script id="mobiusFix20261008"> 是一套：回退时两段一起删。
   ============================================================================== -->
<script id="mobiusFixPrologue20261008">
(function () {
  'use strict';
  window.__mobiusFixPrologue20261008 = true;
  try {
    var EVENTS_KEY = 'dream-messenger:proactive-events:v1';
    var GLOBAL_KEY = 'dream-messenger:global-settings:v1';
    var rawState = localStorage.getItem(EVENTS_KEY);
    if (!rawState) return;
    var state = JSON.parse(rawState);
    if (!state || typeof state !== 'object') return;
    var global = {};
    try { global = JSON.parse(localStorage.getItem(GLOBAL_KEY) || '{}') || {}; } catch (_) { global = {}; }
    /* 面板那一格的最小单位是「秒」（内部口径），下限 60 秒（与 loadGlobalAppSettings 的兜底一致） */
    var minSeconds = Number(global.proactiveMessageMinSeconds);
    if (!(minSeconds >= 60)) minSeconds = 300;
    var minMs = minSeconds * 1000;
    /* 主动消息开关关掉就不管了 */
    if (global.proactiveMessageEnabled === false) return;

    var gate = state.__gate && typeof state.__gate === 'object' ? state.__gate : (state.__gate = {});
    var lastSent = Number(gate.messageAt) || 0;
    var now = Date.now();
    var changed = false;
    var dueKeys = [];
    Object.keys(state).forEach(function (key) {
      if (key === '__gate') return;
      var roleState = state[key];
      if (!roleState || typeof roleState !== 'object') return;
      var due = Number(roleState.messageAt) || 0;
      if (!due || due > now) return;
      dueKeys.push({ key: key, due: due });
    });
    /* ① 先按时间排队：最早的（往往就是「最该先说话」的那位）排在最前面 */
    dueKeys.sort(function (a, b) { return a.due - b.due; });
    /* ② 地板：一次只有一位能开口，且任何一条不得早于「上一条 + 最快」
       —— 这样「好几位梦角同时到点」不会再变成一串连发（用户口径：
         主动设 5~10 分钟，就不该半分钟/一分钟连着来）。 */
    var openAt = 0;
    for (var i = 0; i < dueKeys.length; i += 1) {
      var item = dueKeys[i];
      var roleState = state[item.key];
      var allowedAt = Math.max(openAt, lastSent > 0 ? lastSent + minMs : 0);
      if (i === 0 && allowedAt <= now) {
        /* 第一位：如果上一条已经够久（≥ 最快），就让它按原样兑现（这是「到点就算收到」的补话） */
        openAt = now;
        continue;
      }
      roleState.messageAt = allowedAt + 1000 + Math.floor(Math.random() * 9000);
      changed = true;
      openAt = roleState.messageAt;
    }
    var earliestDue = dueKeys.length ? dueKeys[0].due : 0;
    /* ② 有一次合法的迟到（离开超过 1 分钟）：把真实到点留给页尾补丁块用 */
    if (earliestDue > 0 && now - earliestDue > 60000) {
      window.__mobiusLateDueAt = earliestDue;
    }
    if (changed) {
      try { localStorage.setItem(EVENTS_KEY, JSON.stringify(state)); } catch (_) {}
      window.__mobiusProloguePushed = true;
    }
  } catch (_) { /* 哨兵失败绝不影响启动 */ }
})();
</script>
